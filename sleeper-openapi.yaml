openapi: 3.1.0
info:
  title: Sleeper Fantasy Football MVP API
  version: 1.0.0
  description: >-
    Read-only access to the public Sleeper API for resolving a user and reading
    current NFL state, that user's NFL leagues, league details, rosters, league
    members, and basic player data. This schema intentionally exposes only the
    operations needed by the first MVP.
servers:
  - url: https://api.sleeper.app/v1
    description: Public Sleeper API
tags:
  - name: Users
    description: Resolve Sleeper users and list their NFL leagues.
  - name: Leagues
    description: Read league configuration, rosters, and members.
  - name: NFL
    description: Read current NFL state and resolve Sleeper player IDs.
paths:
  /state/nfl:
    get:
      tags:
        - NFL
      operationId: getNflState
      summary: Get the current NFL season state
      description: >-
        Use this before listing leagues when the current season is unknown. It
        returns Sleeper's current season, week, and league_season so the model
        does not need to guess the year.
      responses:
        "200":
          description: Current NFL calendar and league season state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NflState"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /players/nfl:
    get:
      tags:
        - NFL
      operationId: getNflPlayers
      summary: Get the NFL player ID map
      description: >-
        Resolves Sleeper player_id values from rosters into player names and
        basic player data. Prefer position and active filters whenever possible.
        The unfiltered response is large (about 5 MB according to Sleeper) and
        must not be called repeatedly; Sleeper recommends no more than once per
        day for the complete map.
      parameters:
        - name: position
          in: query
          required: false
          description: >-
            Return only players whose fantasy positions include this value,
            such as QB, RB, WR, or TE. Prefer this filter when a position is known.
          schema:
            type: string
          example: QB
        - name: active
          in: query
          required: false
          description: >-
            Set to true to return only active players. Omit this parameter when
            inactive players are also needed; values other than true are ignored
            by Sleeper.
          schema:
            type: boolean
          example: true
      responses:
        "200":
          description: Player objects keyed by Sleeper player_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMap"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /user/{user_identifier}:
    get:
      tags:
        - Users
      operationId: getSleeperUser
      summary: Find a Sleeper user
      description: >-
        Use this first when the user supplies a Sleeper username or user ID.
        The response provides the stable user_id needed to list leagues.
      parameters:
        - name: user_identifier
          in: path
          required: true
          description: A Sleeper username or numeric Sleeper user_id.
          schema:
            type: string
          examples:
            username:
              value: HenrykManente
            userId:
              value: "1050514781800734720"
      responses:
        "200":
          description: The matching Sleeper user. Sleeper may return JSON null when no user matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                user_id: "1050514781800734720"
                username: HenrykManente
                display_name: HenrykManente
                avatar: null
        default:
          $ref: "#/components/responses/UnexpectedError"

  /user/{user_id}/leagues/nfl/{season}:
    get:
      tags:
        - Users
      operationId: listUserNflLeagues
      summary: List a user's NFL leagues for one season
      description: >-
        Returns every NFL league associated with the stable Sleeper user_id in
        the requested four-digit season. Resolve a username with
        getSleeperUser before calling this operation.
      parameters:
        - name: user_id
          in: path
          required: true
          description: Stable numeric Sleeper user ID. Do not pass a username here.
          schema:
            type: string
            pattern: "^[0-9]+$"
          example: "1050514781800734720"
        - name: season
          in: path
          required: true
          description: Four-digit NFL season year, such as 2025 or 2026.
          schema:
            type: string
            pattern: "^[0-9]{4}$"
          example: "2026"
      responses:
        "200":
          description: A list of NFL leagues. An empty list means none were found for that season.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /league/{league_id}:
    get:
      tags:
        - Leagues
      operationId: getLeagueDetails
      summary: Get one league
      description: >-
        Returns the league name, season, status, roster slots, scoring settings,
        and identifiers. Use this to confirm league context before reading its
        rosters or members.
      parameters:
        - name: league_id
          in: path
          required: true
          description: Numeric identifier of a Sleeper league, returned by listUserNflLeagues.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: The requested league. Sleeper may return JSON null when no league matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /league/{league_id}/rosters:
    get:
      tags:
        - Leagues
      operationId: listLeagueRosters
      summary: List all rosters in a league
      description: >-
        Returns each fantasy roster, including roster_id, owner_id, player IDs,
        starters, reserve players, and basic record settings. Match owner_id to
        user_id from listLeagueMembers when a human-readable owner is needed.
      parameters:
        - name: league_id
          in: path
          required: true
          description: Numeric identifier of a Sleeper league, returned by listUserNflLeagues.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: All rosters in the league.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Roster"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /league/{league_id}/users:
    get:
      tags:
        - Leagues
      operationId: listLeagueMembers
      summary: List all users in a league
      description: >-
        Returns league members and their display metadata. Join each member's
        user_id to a roster's owner_id to identify who manages that roster.
      parameters:
        - name: league_id
          in: path
          required: true
          description: Numeric identifier of a Sleeper league, returned by listUserNflLeagues.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: All users or members in the league.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueMember"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  responses:
    UnexpectedError:
      description: Unexpected response from the Sleeper API.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  schemas:
    NflState:
      type: object
      description: Sleeper's current NFL calendar and league-season context.
      required:
        - season
        - week
        - league_season
      properties:
        season:
          type: string
          description: Current NFL season year.
        week:
          type: integer
          description: Current NFL week.
        league_season:
          type: string
          description: Active season to use when listing Sleeper leagues.
        season_type:
          type: string
          nullable: true
          description: Current phase, such as pre, regular, or post.
        leg:
          type: integer
          nullable: true
          description: Current scoring leg or week used by Sleeper.
        display_week:
          type: integer
          nullable: true
          description: Week Sleeper currently displays in its interface.
        previous_season:
          type: string
          nullable: true
          description: Previous NFL season year.
        season_start_date:
          type: string
          nullable: true
          description: Regular-season start date when available.
        league_create_season:
          type: string
          nullable: true
          description: Season assigned to newly created leagues.

    PlayerMap:
      type: object
      description: Map keyed by Sleeper player_id, including team defense IDs.
      properties: {}
      additionalProperties:
        $ref: "#/components/schemas/Player"

    Player:
      type: object
      description: Basic Sleeper player identity and availability data.
      properties:
        player_id:
          type: string
          nullable: true
          description: Sleeper player identifier.
        first_name:
          type: string
          nullable: true
          description: Player first name.
        last_name:
          type: string
          nullable: true
          description: Player last name.
        full_name:
          type: string
          nullable: true
          description: Player full name when provided by Sleeper.
        position:
          type: string
          nullable: true
          description: Primary fantasy position.
        fantasy_positions:
          type: array
          nullable: true
          description: Fantasy positions for which the player is eligible.
          items:
            type: string
        team:
          type: string
          nullable: true
          description: Current NFL team abbreviation.
        active:
          type: boolean
          nullable: true
          description: Whether Sleeper currently marks the player active.
        status:
          type: string
          nullable: true
          description: Current roster or availability status.
        injury_status:
          type: string
          nullable: true
          description: Current injury designation when present.
        age:
          type: integer
          nullable: true
          description: Player age when available.
        years_exp:
          type: integer
          nullable: true
          description: Completed or credited years of NFL experience.

    User:
      type: object
      description: A Sleeper account. user_id is stable; username can change.
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Stable numeric Sleeper user identifier.
        username:
          type: string
          nullable: true
          description: Current Sleeper username.
        display_name:
          type: string
          nullable: true
          description: Name shown in the Sleeper interface.
        avatar:
          type: string
          nullable: true
          description: Sleeper avatar identifier, when configured.

    League:
      type: object
      description: Core league data plus flexible Sleeper configuration objects.
      required:
        - league_id
        - name
        - season
        - sport
      properties:
        league_id:
          type: string
          description: Stable identifier for this season's league instance.
        name:
          type: string
          description: League display name.
        sport:
          type: string
          description: Sport code. This MVP requests only nfl.
          example: nfl
        season:
          type: string
          description: Four-digit season year.
        season_type:
          type: string
          nullable: true
          description: Season phase used by the league, usually regular.
        status:
          type: string
          nullable: true
          description: League lifecycle state, such as pre_draft, drafting, in_season, or complete.
        total_rosters:
          type: integer
          nullable: true
          description: Number of roster slots in the league.
        avatar:
          type: string
          nullable: true
          description: League avatar identifier, when configured.
        draft_id:
          type: string
          nullable: true
          description: Identifier of the league's primary draft, when present.
        previous_league_id:
          type: string
          nullable: true
          description: Prior season's league_id, when this league was renewed.
        roster_positions:
          type: array
          nullable: true
          description: Ordered fantasy lineup slots configured for the league.
          items:
            type: string
        settings:
          type: object
          nullable: true
          description: Sleeper league settings. Keys vary by league and season.
          additionalProperties: true
        scoring_settings:
          type: object
          nullable: true
          description: Scoring values keyed by Sleeper stat code.
          additionalProperties:
            type: number

    Roster:
      type: object
      description: A fantasy roster and its Sleeper player identifiers.
      required:
        - roster_id
        - league_id
      properties:
        roster_id:
          type: integer
          description: Roster number within the league.
        league_id:
          type: string
          description: League containing this roster.
        owner_id:
          type: string
          nullable: true
          description: Sleeper user_id of the primary owner; can be null for an unclaimed roster.
        co_owners:
          type: array
          nullable: true
          description: Sleeper user_ids of co-owners, when present.
          items:
            type: string
        players:
          type: array
          nullable: true
          description: Sleeper player IDs currently on the roster.
          items:
            type: string
        starters:
          type: array
          nullable: true
          description: Sleeper player IDs currently assigned to starting slots.
          items:
            type: string
        reserve:
          type: array
          nullable: true
          description: Sleeper player IDs in reserve or injured-reserve slots.
          items:
            type: string
        taxi:
          type: array
          nullable: true
          description: Sleeper player IDs on the taxi squad, when used.
          items:
            type: string
        settings:
          type: object
          nullable: true
          description: Record, points, waiver, and move totals. Keys vary by league.
          additionalProperties: true
        metadata:
          type: object
          nullable: true
          description: Optional roster metadata supplied by Sleeper.
          additionalProperties: true

    LeagueMember:
      type: object
      description: A Sleeper user as represented within a league.
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Stable Sleeper user ID; matches roster.owner_id.
        username:
          type: string
          nullable: true
          description: Current Sleeper username.
        display_name:
          type: string
          nullable: true
          description: Display name shown in the league.
        avatar:
          type: string
          nullable: true
          description: Sleeper avatar identifier, when configured.
        is_owner:
          type: boolean
          nullable: true
          description: Whether the member is a league commissioner or owner.
        metadata:
          type: object
          nullable: true
          description: League-specific member data such as team_name; keys can vary.
          additionalProperties: true
