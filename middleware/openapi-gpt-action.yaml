openapi: 3.1.0
info:
  title: Sleeper Player Resolver API
  version: 1.0.0
  description: Resolves up to 100 Sleeper player IDs into compact player records.
servers:
  - url: https://fantasy-gmassistant-middleware.vercel.app
paths:
  /players/resolve:
    post:
      operationId: resolveSleeperPlayers
      summary: Resolve Sleeper player IDs
      description: >-
        Returns compact data only for the requested player IDs. Duplicate IDs
        are removed. Use this operation instead of calling Sleeper's complete
        NFL player map from a model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - player_ids
              properties:
                player_ids:
                  type: array
                  maxItems: 100
                  description: Sleeper player IDs. Duplicate values are resolved once.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
              additionalProperties: false
      responses:
        "200":
          description: Requested players and IDs not present in the Sleeper map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvePlayersResponse"
        "400":
          description: Invalid JSON or invalid player_ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Sleeper player data is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ResolvePlayersResponse:
      type: object
      required:
        - players
        - not_found
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/CompactPlayer"
        not_found:
          type: array
          items:
            type: string
      additionalProperties: false
    CompactPlayer:
      type: object
      required:
        - player_id
        - full_name
        - first_name
        - last_name
        - position
        - fantasy_positions
        - team
        - active
        - status
        - injury_status
        - age
        - years_exp
      properties:
        player_id:
          type: string
        full_name:
          type:
            - string
            - "null"
        first_name:
          type:
            - string
            - "null"
        last_name:
          type:
            - string
            - "null"
        position:
          type:
            - string
            - "null"
        fantasy_positions:
          type: array
          items:
            type: string
        team:
          type:
            - string
            - "null"
        active:
          type:
            - boolean
            - "null"
        status:
          type:
            - string
            - "null"
        injury_status:
          type:
            - string
            - "null"
        age:
          type:
            - number
            - "null"
        years_exp:
          type:
            - number
            - "null"
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
